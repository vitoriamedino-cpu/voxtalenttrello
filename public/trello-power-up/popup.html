<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VoxTalent</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      color: #0C0D0E;
    }

    h2 {
      margin: 0 0 16px;
    }

    .card {
      background: #f5f7f7;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .value {
      font-weight: 600;
      word-break: break-word;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #e8f7f6;
      color: #00857e;
      font-weight: bold;
    }

    .error {
      padding: 10px;
      border-radius: 8px;
      background: #fff0f0;
      color: #b42318;
    }
  </style>
</head>

<body>

  <h2>📱 VoxTalent</h2>

  <div id="status" class="status">
    Lendo dados do candidato...
  </div>

  <div id="candidate" style="display: none;">

    <div class="card">
      <div class="label">Candidato</div>
      <div id="name" class="value"></div>
    </div>

    <div class="card">
      <div class="label">Descrição do card</div>
      <div id="description" class="value"></div>
    </div>

    <div class="card">
      <div class="label">Link do card</div>
      <div id="url" class="value"></div>
    </div>

  </div>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>
  const status = document.getElementById("status");
  const candidate = document.getElementById("candidate");

  function showError(message) {
    status.className = "error";
    status.textContent = message;
  }

  async function loadCard() {
    try {
      if (!window.TrelloPowerUp) {
        throw new Error("Biblioteca do Trello não carregou.");
      }

      const t = window.TrelloPowerUp.iframe();

      status.textContent = "Conectando ao Trello...";

      const card = await t.card("id", "name", "desc", "url");

      console.log("VOXTALENT CARD:", card);

      if (!card) {
        throw new Error("O Trello não retornou os dados do card.");
      }

      document.getElementById("name").textContent =
        card.name || "Não informado";

      document.getElementById("description").textContent =
        card.desc || "Sem descrição";

      document.getElementById("url").textContent =
        card.url || "Sem URL";

      status.className = "status";
      status.textContent = "✓ Card carregado pelo VoxTalent";

      candidate.style.display = "block";

    } catch (error) {

      console.error("ERRO VOXTALENT:", error);

      showError(
        "Erro ao acessar o card: " +
        (error && error.message ? error.message : String(error))
      );
    }
  }

  loadCard();
</script>

</body>
</html>
